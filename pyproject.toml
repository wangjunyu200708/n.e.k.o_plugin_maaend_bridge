[project]
name = "n.e.k.o_plugin_maaend_bridge"
version = "0.1.0"
description = "N.E.K.O MaaEnd executor bridge plugin (run Endfield automation tasks, narrate progress)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
